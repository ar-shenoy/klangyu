<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Klangyu share card</title>
<style>
  @font-face {
    font-family: "Jost";
    src: url("Jost-var.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #14161C;
    color: #F4F1EA;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .field {
    position: absolute;
    inset: 0;
  }
  .lockup {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .seal {
    width: 124px;
    height: 124px;
    border-radius: 28px;
    box-shadow: 0 0 0 3px #F4F1EA;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .seal svg { display: block; width: 124px; height: 124px; }
  .name {
    font-family: "Jost", "Futura", sans-serif;
    font-weight: 500;
    font-size: 222px;
    line-height: 0.82;
    letter-spacing: -0.035em;
    color: #F4F1EA;
    margin: 0;
  }
  .u {
    position: relative;
    display: inline-block;
  }
  .dots {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translate(-50%, 0.22em);
    display: flex;
    gap: 0.085em;
  }
  .dots i {
    width: 0.115em;
    height: 0.115em;
    border-radius: 50%;
    background: #D8342C;
    display: block;
  }
  .rule {
    width: 72px;
    height: 2px;
    background: #C9A24B;
    margin: 30px 0 18px;
    border-radius: 1px;
  }
  .tag {
    font-family: "Jost", "Futura", sans-serif;
    font-weight: 500;
    font-size: 26px;
    line-height: 1;
    letter-spacing: 0.16em;
    color: #C9A24B;
    margin: 0;
  }
</style>
</head>
<body>
  <svg class="field" viewBox="0 0 1200 630" aria-hidden="true">
    <defs>
      <radialGradient id="glow" cx="50%" cy="46%" r="62%">
        <stop offset="0%" stop-color="#222838"/>
        <stop offset="58%" stop-color="#14161C"/>
        <stop offset="100%" stop-color="#101218"/>
      </radialGradient>
      <radialGradient id="quiet" cx="50%" cy="48%" r="48%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
        <stop offset="42%" stop-color="#fff" stop-opacity="0.05"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0.9"/>
      </radialGradient>
      <mask id="edge">
        <rect width="1200" height="630" fill="url(#quiet)"/>
      </mask>
    </defs>
    <rect width="1200" height="630" fill="url(#glow)"/>
    <g fill="none" mask="url(#edge)" stroke-linecap="round">
      <circle cx="600" cy="300" r="250" stroke="#3C5A78" stroke-width="1.25" opacity="0.85"/>
      <circle cx="600" cy="300" r="318" stroke="#C9A24B" stroke-width="1.15" opacity="0.55"/>
      <circle cx="600" cy="300" r="392" stroke="#3C5A78" stroke-width="1.35" opacity="0.7"/>
      <circle cx="600" cy="300" r="470" stroke="#C9A24B" stroke-width="1.1" opacity="0.4"/>
      <circle cx="600" cy="300" r="548" stroke="#3C5A78" stroke-width="1.5" opacity="0.55"/>
      <circle cx="600" cy="300" r="640" stroke="#C9A24B" stroke-width="1.2" opacity="0.32"/>
    </g>
  </svg>
  <div class="lockup">
    <div class="seal">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Klangyu seal">
        <rect width="512" height="512" rx="112" fill="#14161C"/>
        <line x1="156.4" y1="156.4" x2="156.4" y2="355.6" stroke="#F4F1EA" stroke-width="42.7" stroke-linecap="round"/>
        <line x1="175.4" y1="256" x2="289.2" y2="156.4" stroke="#F4F1EA" stroke-width="42.7" stroke-linecap="round"/>
        <line x1="175.4" y1="256" x2="284.4" y2="350.8" stroke="#F4F1EA" stroke-width="42.7" stroke-linecap="round"/>
        <rect x="260.7" y="260.7" width="94.8" height="94.8" rx="14.2" fill="#D8342C"/>
        <g transform="translate(279.4 329.9) scale(0.05712 -0.05712)">
          <path fill="#F4F1EA" d="M35 611H313V497H35ZM125 836H237V165H125ZM26 151Q79 173 155 211Q230 249 306 289L341 183Q274 144 203 104Q133 63 71 31ZM329 712H959V603H329ZM298 130Q342 138 398 150Q455 162 518 176Q581 191 644 205L655 106Q571 82 484 59Q397 37 326 18ZM647 849H762Q760 749 763 649Q766 549 773 457Q780 364 791 285Q801 207 815 148Q828 89 844 56Q859 23 875 23Q886 23 892 53Q898 82 900 149Q917 129 939 111Q962 93 981 83Q973 17 959 -21Q945 -59 921 -74Q898 -89 859 -89Q816 -89 783 -52Q751 -14 728 54Q704 122 689 212Q673 302 665 407Q656 512 652 624Q648 737 647 849ZM780 791 848 849Q877 829 909 801Q941 774 958 752L888 687Q871 709 840 739Q809 768 780 791ZM838 537 945 518Q899 317 810 165Q722 12 589 -83Q581 -73 565 -59Q549 -44 533 -30Q516 -16 503 -7Q635 76 717 215Q799 355 838 537ZM446 445V322H522V445ZM358 537H615V230H358Z"/>
        </g>
      </svg>
    </div>
    <p class="name">Klangy<span class="u">u<span class="dots" aria-hidden="true"><i></i><i></i></span></span></p>
    <div class="rule"></div>
    <p class="tag">Your realm of sound</p>
  </div>
</body>
</html>
